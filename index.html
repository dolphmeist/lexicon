<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arabic Lexicon Library — مكتبة المعاجم</title>

<!-- Amiri Quran (Qur'anic / display) + Scheherazade New (Arabic body). Swap to self-hosted to match the tafsir site exactly. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet" />

<style>
  /* -------- Self-hosted Brill (Latin). Drop the woff2 into ./fonts/ ; falls back to serif until then. -------- */
  @font-face {
    font-family: "Brill";
    src: url("./fonts/Brill-Roman.woff2") format("woff2");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Brill";
    src: url("./fonts/Brill-Italic.woff2") format("woff2");
    font-weight: 400; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Brill";
    src: url("./fonts/Brill-Bold.woff2") format("woff2");
    font-weight: 700; font-style: normal; font-display: swap;
  }

  :root {
    --ink:        #1b2447;   /* indigo */
    --gold:       #c9a227;   /* gold  */
    --paper:      #faf6ee;   /* paper */
    --ink-soft:   #2c396a;
    --gold-soft:  #e6d49a;
    --line:       #e3dac3;
    --paper-2:    #f3ecdc;
    --ink-mute:   #6a708a;

    --latin: "Brill", "Cormorant Garamond", Georgia, serif;
    --arabic: "Scheherazade New", serif;
    --quran: "Amiri Quran", "Scheherazade New", serif;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--latin);
    font-size: 18px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--ink); }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px 80px; }

  /* -------------------- Illuminated header -------------------- */
  header.masthead {
    text-align: center;
    padding: 34px 20px 30px;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .masthead .frame {
    display: inline-block;
    padding: 22px 46px 20px;
    border: 2px solid var(--gold);
    border-radius: 3px;
    position: relative;
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box,
      repeating-linear-gradient(45deg, var(--gold-soft) 0 6px, transparent 6px 12px) border-box;
  }
  .masthead .frame::before,
  .masthead .frame::after {
    content: "";
    position: absolute;
    left: 8px; right: 8px;
    height: 1px;
    background: var(--gold);
    opacity: .5;
  }
  .masthead .frame::before { top: 8px; }
  .masthead .frame::after  { bottom: 8px; }

  .masthead .title-ar {
    font-family: var(--quran);
    font-size: 40px;
    color: var(--ink);
    direction: rtl;
    line-height: 1.2;
    margin: 0 0 4px;
  }
  .masthead .title-en {
    font-family: var(--latin);
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 15px;
    color: var(--gold);
    margin: 0;
  }
  .masthead .sub {
    margin: 16px auto 0;
    max-width: 560px;
    color: var(--ink-mute);
    font-size: 15px;
    font-style: italic;
  }

  /* -------------------- Command bar -------------------- */
  .command {
    display: grid;
    grid-template-columns: 0.85fr 1fr;
    align-items: start;
    gap: 18px;
    margin-bottom: 26px;
  }
  @media (max-width: 680px) { .command { grid-template-columns: 1fr; } }

  .field label {
    display: block;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-bottom: 7px;
  }
  .field label .ar { font-family: var(--arabic); text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--gold); }

  /* Search input */
  .root-search {
    width: 100%;
    height: 52px;
    font-family: var(--arabic);
    font-size: 22px;
    text-align: center;
    direction: rtl;
    padding: 0 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  .root-search::placeholder { color: #b9b19a; font-size: 19px; }
  .root-search:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-soft);
  }

  /* Candidate root chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chips .hint { width: 100%; font-size: 13px; color: var(--ink-mute); font-style: italic; margin-bottom: 2px; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    background: #fff;
    border: 1px solid var(--gold);
    border-radius: 20px;
    cursor: pointer;
    font-family: var(--arabic);
    font-size: 20px;
    color: var(--ink);
    transition: background .15s;
  }
  .chip:hover, .chip:focus-visible { background: var(--gold-soft); outline: none; }
  .chip .n { font-family: var(--latin); font-size: 12px; color: var(--ink-mute); }
  .chip.none { border-color: var(--line); color: var(--ink-mute); cursor: default; font-family: var(--latin); font-size: 14px; }

  /* ---------- Root index accordion ---------- */
  .browse { margin-top: 18px; padding-top: 0; }
  .browse-head {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none; padding-bottom: 4px;
  }
  .browse-head h2 {
    margin: 0; font-family: var(--latin); font-size: 14px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mute); font-weight: 400;
  }
  .browse-head h2 .ar { font-family: var(--arabic); font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--gold); }
  .letter-grid {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 8px;
    direction: rtl;
    margin-top: 10px;
  }
  @media (max-width: 900px) { .letter-grid { grid-template-columns: repeat(10, 1fr); } }
  @media (max-width: 620px) { .letter-grid { grid-template-columns: repeat(7, 1fr); } }
  .letter-tile {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 14px;
    background: var(--paper-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    user-select: none;
  }
  .letter-tile:hover { border-color: var(--gold); }
  .letter-tile:focus-visible { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .letter-tile[aria-selected="true"] {
    background: var(--ink);
    border-color: var(--ink);
  }
  .letter-tile .lt {
    font-family: var(--quran);
    font-size: 24px;
    line-height: 1;
    color: var(--ink);
    direction: rtl;
  }
  .letter-tile[aria-selected="true"] .lt { color: var(--paper); }
  .letter-tile .cnt {
    position: absolute;
    bottom: 3px;
    left: 0; right: 0;
    text-align: center;
    font-family: var(--latin);
    font-size: 9.5px;
    color: var(--ink-mute);
    letter-spacing: .02em;
  }
  .letter-tile[aria-selected="true"] .cnt { color: var(--gold-soft); }

  .letter-panel {
    display: none;
    margin-top: 10px;
    padding: 16px 18px;
    border: 1px solid var(--gold);
    border-radius: 4px;
    background: #fff;
    direction: rtl;
    text-align: right;
    line-height: 2.4;
  }
  .letter-panel.open { display: block; }
  .root-link {
    display: inline-block;
    font-family: var(--arabic);
    font-size: 20px;
    color: var(--ink);
    text-decoration: none;
    padding: 1px 9px;
    margin: 0 1px;
    border-radius: 3px;
    cursor: pointer;
    transition: background .12s, color .12s;
  }
  .root-link:hover, .root-link:focus-visible { background: var(--gold-soft); color: var(--ink); outline: none; }
  .root-link.current { background: var(--ink); color: var(--paper); }

  /* Untranslated notice */
  .untranslated {
    font-family: var(--latin); font-size: 13px; font-style: italic;
    color: var(--ink-mute); text-align: center;
    padding: 8px 0 2px;
  }

  /* Custom floating dropdown (not a native select) */
  .dropdown { position: relative; }
  .dropdown-btn {
    width: 100%;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 16px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--ink);
    font-family: var(--latin);
    font-size: 17px;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, box-shadow .15s;
  }
  .dropdown-btn:focus-visible { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .dropdown-btn[aria-expanded="true"] { border-color: var(--gold); }
  .dropdown-btn .placeholder { color: #b9b19a; }
  .caret {
    width: 0; height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 7px solid var(--gold);
    transition: transform .18s ease;
    flex: none;
  }
  .dropdown-btn[aria-expanded="true"] .caret { transform: rotate(180deg); }

  .dropdown-panel {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: #fff;
    border: 1px solid var(--gold);
    border-radius: 4px;
    box-shadow: 0 12px 30px rgba(27,36,71,.16);
    z-index: 40;
    overflow: hidden;
    display: none;
  }
  .dropdown-panel.open { display: block; }
  .dropdown-opt {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 16px;
    cursor: pointer;
    border-bottom: 1px solid var(--paper-2);
  }
  .dropdown-opt:last-child { border-bottom: 0; }
  .dropdown-opt:hover, .dropdown-opt.active { background: var(--paper-2); }
  .dropdown-opt .opt-en { font-family: var(--latin); font-size: 16px; }
  .dropdown-opt .opt-ar { font-family: var(--arabic); font-size: 19px; color: var(--ink-soft); direction: rtl; }

  /* -------------------- تشكيل toggle (inline in command bar) -------------------- */
  .tashkil-field label { visibility: hidden; }
  @media (max-width: 680px) { .tashkil-field label { display: none; } }
  .tashkil-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 52px;
    padding: 0 20px;
    white-space: nowrap;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 20px;
    cursor: pointer;
    font-family: var(--arabic);
    font-size: 17px;
    color: var(--ink-mute);
    transition: all .15s;
  }
  .tashkil-toggle[aria-pressed="true"] {
    border-color: var(--gold);
    color: var(--ink);
    background: var(--paper-2);
  }
  .tashkil-toggle .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--line);
  }
  .tashkil-toggle[aria-pressed="true"] .dot { background: var(--gold); }

  /* -------------------- Entry region -------------------- */
  /* Framed entry card */
  .entry-card {
    background: #fffdf7;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 26px 30px 32px;
    margin-top: 4px;
    box-shadow: 0 1px 3px rgba(27,36,71,.04);
  }

  .entry-head {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 34px;
    align-items: end;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--gold);
  }
  @media (max-width: 680px) { .entry-head { grid-template-columns: 1fr; gap: 6px; } }
  .entry-head .side-ar { direction: rtl; text-align: right; }
  .entry-head .side-en { direction: ltr; text-align: left; }
  .entry-head .root-ar {
    font-family: var(--quran);
    font-size: 38px;
    line-height: 1.1;
    color: var(--ink);
  }
  .entry-head .root-en {
    font-family: var(--latin);
    font-size: 26px;
    letter-spacing: .04em;
    color: var(--ink);
  }

  /* Toolbar inside the card */
  .tool-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 0 4px;
    flex-wrap: wrap;
  }
  .tool-row .left { display: flex; gap: 10px; align-items: center; }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 15px;
    background: transparent;
    border: 1px solid var(--gold);
    border-radius: 20px;
    cursor: pointer;
    font-family: var(--latin);
    font-size: 14px;
    color: var(--ink);
    transition: background .15s, color .15s;
  }
  .pill-btn.ar { font-family: var(--arabic); font-size: 17px; }
  .pill-btn:hover { background: var(--gold-soft); }
  .pill-btn.copied { background: var(--gold); border-color: var(--gold); }
  .pill-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* Bilingual two-column paragraph rows */
  .para {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 34px;
    padding: 16px 0;
    border-bottom: 1px solid var(--paper-2);
  }
  @media (max-width: 680px) { .para { grid-template-columns: 1fr; gap: 14px; } }

  .para .ar {
    direction: rtl;
    text-align: right;
    font-family: var(--arabic);
    font-size: 22px;
    line-height: 2;
    color: var(--ink);
  }
  .para .en {
    direction: ltr;
    text-align: left;
    font-family: var(--latin);
    font-size: 17.5px;
    line-height: 1.75;
    color: #2a2f45;
  }
  /* analysed term *italics* */
  .para em, .para .term { font-style: italic; color: var(--ink-soft); }
  .para .ar .term { font-style: normal; color: var(--gold); }
  /* Qur'anic shāhid **{ }** */
  .shahid { font-weight: 700; color: var(--ink); }
  .para .ar .shahid { font-family: var(--arabic); }
  .para .en .shahid { font-family: var(--latin); color: var(--ink-soft); }

  .para .note {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dotted var(--line);
    font-size: 13.5px;
    font-style: italic;
    color: var(--ink-mute);
    line-height: 1.55;
  }

  /* Page divider: rule across, pill centred */
  .page-pill-row {
    display: flex;
    align-items: center;
    padding: 14px 0 10px;
  }
  .page-pill-row::before,
  .page-pill-row::after {
    content: "";
    flex: 1;
    height: 1px;
  }
  .page-pill-row::before {
    background: linear-gradient(to right, transparent 0%, var(--gold-soft) 18%, var(--gold-soft) 100%);
  }
  .page-pill-row::after {
    background: linear-gradient(to left, transparent 0%, var(--gold-soft) 18%, var(--gold-soft) 100%);
  }
  .page-pill {
    flex: none;
    margin: 0 14px;
    font-family: var(--latin);
    font-size: 12.5px;
    letter-spacing: .06em;
    color: var(--gold);
    background: #fffdf7;
    border: 1px solid var(--gold);
    border-radius: 20px;
    padding: 3px 14px;
    direction: ltr;
  }

  /* Empty / loading states */
  .state {
    text-align: center;
    color: var(--ink-mute);
    font-style: italic;
    padding: 70px 20px;
    font-size: 17px;
  }
  .state .ar { font-family: var(--arabic); font-style: normal; display: block; margin-top: 8px; font-size: 20px; color: var(--ink-soft); direction: rtl; }

  footer {
    margin-top: 60px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    text-align: center;
    color: var(--ink-mute);
    font-size: 13px;
  }

  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body>
<div class="wrap">

  <!-- ===================== Masthead ===================== -->
  <header class="masthead">
    <div class="frame">
      <h1 class="title-ar">مكتبة المعاجم</h1>
      <p class="title-en">Arabic Lexicon Library</p>
    </div>
    <p class="sub">Classical dictionaries of the Arabic language, arranged by root.</p>
  </header>

  <!-- ===================== Command bar ===================== -->
  <div class="command">
    <div class="field">
      <label for="rootSearch">Search</label>
      <input id="rootSearch" class="root-search" type="text" inputmode="text"
             placeholder="Paste any word — e.g. مكتوب" autocomplete="off" spellcheck="false" />
      <div class="chips" id="chips"></div>
    </div>

    <div class="field">
      <label>Lexicon</label>
      <div class="dropdown" id="lexDropdown">
        <button type="button" class="dropdown-btn" aria-haspopup="listbox" aria-expanded="false">
          <span class="label placeholder">Choose a lexicon</span>
          <span class="caret" aria-hidden="true"></span>
        </button>
        <div class="dropdown-panel" role="listbox" aria-label="Lexicon"></div>
      </div>
    </div>
  </div>

  <!-- ===================== Entry region ===================== -->
  <main id="entry" aria-live="polite">

  </main>

  <section class="browse">
    <div class="browse-head" id="browseHead" role="button" tabindex="0" aria-expanded="true">
      <h2>Browse roots</h2>
      
    </div>
    <div id="letters"></div>
  </section>

  <footer>
    Text sourced from named print editions via the OpenITI / Shamela open corpora. Translations and collation are editorial.<br><span style="opacity:.55;font-size:11px">build 11</span>
  </footer>

</div>

<script>
/* =====================================================================
   Arabic Lexicon Library
   Data layout:
     root-index.json            — every root, grouped by letter
     forms-index.json           — inflected form -> candidate roots
     <lexicon>/<letter>/<root>.json
        { lexicon, root, root_display, forms:[…],
          citation:{volume,page_from,page_to},
          entries:[ { ar, ar_vocalised, en, pg, note } ] }
     Arabic, vocalised Arabic and English live together in that one file.
   ===================================================================== */

const LEXICA = [
  { id: "lisan",    en: "Lisān al-ʿArab",                 ar: "لسان العرب" },
  { id: "taj",      en: "Tāj al-ʿArūs",                   ar: "تاج العروس" },
  { id: "qamus",    en: "al-Qāmūs al-Muḥīṭ",              ar: "القاموس المحيط" },
  { id: "maqayis",  en: "Maqāyīs al-Lugha",               ar: "مقاييس اللغة" },
  { id: "sihah",    en: "al-Ṣiḥāḥ (al-Jawharī)",          ar: "الصحاح" },
  { id: "mufradat", en: "Mufradāt al-Rāghib al-Iṣfahānī", ar: "مفردات الراغب" }
];


/* ---------------- normalisation & formatting ---------------- */
const ALIF = { "أ":"ا","إ":"ا","آ":"ا","ٱ":"ا" };
function norm(s) {
  return (s || "")
    .replace(/[\u064B-\u0652\u0670\u0640]/g, "")
    .replace(/\s+/g, "")
    .replace(/[أإآٱ]/g, "ا")
    .replace(/ى/g, "ي")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")
    .replace(/ة/g, "ه")
    .trim();
}
function fmt(t) {
  if (!t) return "";
  let o = t.replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
  o = o.replace(/\*\*\{\s*([\s\S]*?)\s*\}\*\*/g, '<span class="shahid">{ $1 }</span>');
  o = o.replace(/\*([^*]+)\*/g, '<span class="term">$1</span>');
  return o;
}
const lexById = id => LEXICA.find(l => l.id === id);

/* Root transliteration — project rules: ḳ = ḳāʾ (خ), q = qāf, ḍ = ḍād,
   ḋ = ẓāʾ, ʿ curved ʿayn, ġ = ġayn, hamza = straight apostrophe. */
const TR = { "ا":"a","ب":"b","ت":"t","ث":"th","ج":"j","ح":"ḥ","خ":"ḳ","د":"d","ذ":"dh",
  "ر":"r","ز":"z","س":"s","ش":"sh","ص":"ṣ","ض":"ḍ","ط":"ṭ","ظ":"ḋ","ع":"ʿ","غ":"ġ",
  "ف":"f","ق":"q","ك":"k","ل":"l","م":"m","ن":"n","ه":"h","و":"w","ي":"y",
  "ء":"'","أ":"'","إ":"'","آ":"'","ؤ":"'","ئ":"'","ة":"a","ى":"ā" };
function translitRoot(r) {
  return Array.from(r.replace(/[\u064B-\u0652\u0670\u0640\s]/g, ""))
    .map(c => TR[c] || c).join("-");
}



/* ---------------- word -> root lookup ----------------
   exact root -> corpus forms index -> clitic-stripped variants
   -> morphological fallback (augment letters سألتمونيها, one weak
   radical may be elided, covering hollow and assimilated roots). */
const AUG = new Set("سالتمونيهاءو".split(""));
const WEAK = new Set(["و", "ي", "ا"]);
function score(w, r) {
  const n = w.length, m = r.length, memo = new Map();
  function f(i, j, s) {
    if (j === m) { let ex = 0; for (let k = i; k < n; k++) { if (!AUG.has(w[k])) return Infinity; ex++; } return ex; }
    if (i === n) return (m - j === 1 && s === 0 && WEAK.has(r[j])) ? 0.5 : Infinity;
    const k = i + "," + j + "," + s;
    if (memo.has(k)) return memo.get(k);
    let b = Infinity;
    if (w[i] === r[j]) b = Math.min(b, f(i + 1, j + 1, s));
    if (AUG.has(w[i])) b = Math.min(b, 1 + f(i + 1, j, s));
    if (s === 0 && WEAK.has(r[j])) b = Math.min(b, 0.5 + f(i, j + 1, 1));
    memo.set(k, b); return b;
  }
  return f(0, 0, 0);
}
const CLITIC = [/^وال/, /^فال/, /^بال/, /^كال/, /^لل/, /^ال/, /^و/, /^ف/, /^ب/, /^ك/, /^ل/, /^س/];
const SUFFIX = [/ون$/, /ين$/, /ات$/, /ان$/, /وا$/, /ها$/, /هم$/, /كم$/, /نا$/, /ه$/, /ك$/, /ي$/, /ت$/];
function variants(w) {
  const v = new Set([w]);
  for (const c of CLITIC) if (c.test(w)) {
    const t = w.replace(c, "");
    if (t.length >= 3) { v.add(t); for (const x of SUFFIX) if (x.test(t)) { const u = t.replace(x, ""); if (u.length >= 3) v.add(u); } }
  }
  for (const x of SUFFIX) if (x.test(w)) { const u = w.replace(x, ""); if (u.length >= 3) v.add(u); }
  return [...v];
}
function candidates(input) {
  const w = norm(input);
  if (!w) return [];
  if (NORM2ROOT.has(w)) return [NORM2ROOT.get(w)];
  const seen = new Set(), out = [];
  for (const v of variants(w)) for (const r of (FORMS[v] || [])) if (!seen.has(r)) { seen.add(r); out.push(r); }
  if (out.length) return out.slice(0, 8);
  const m = [];
  for (const r of ROOTS) { if (r.length > w.length + 1) continue; const sc = score(w, r); if (sc < Infinity) m.push({ r, sc }); }
  m.sort((a, b) => a.sc - b.sc || a.r.length - b.r.length);
  return m.slice(0, 8).map(x => NORM2ROOT.get(x.r));
}

let state = { root: null, lex: null, tashkil: false };
let INDEX = [];              // [{letter, roots:[{r,d,x}]}]
let NORM2ROOT = new Map();   // normalised -> original root
let ROOTS = [];              // normalised root list
let FORMS = {};              // surface form -> [roots]

async function loadIndex() {
  try {
    const r = await fetch("./root-index.json");
    if (!r.ok) throw new Error(r.status);
    INDEX = await r.json();
    for (const g of INDEX) for (const x of g.roots) {
      const k = norm(x.r);
      if (!NORM2ROOT.has(k)) { NORM2ROOT.set(k, x.r); ROOTS.push(k); }
    }
    buildLetters();
  } catch (err) {
    document.getElementById("letters").innerHTML =
      '<div class="state">Root index not loaded. Check that <code>root-index.json</code> sits next to index.html.</div>';
  }
  try { FORMS = await (await fetch("./forms-index.json")).json(); } catch (e) { FORMS = {}; }
}

const ALIF_L = { "أ":"ا","إ":"ا","آ":"ا","ٱ":"ا" };
const ENTRIES = new Map();          // "lex:root" -> record | null

/* One file per root per lexicon:  <lexicon>/<letter>/<root>.json
   It holds the Arabic, the vocalised Arabic, and the English together.
   Tries composed (NFC) then decomposed (NFD) filenames — macOS writes NFD,
   browsers request NFC, and those are different bytes for the same name. */
async function loadEntry(root, lex) {
  const key = lex + ":" + root;
  if (ENTRIES.has(key)) return ENTRIES.get(key);
  const L = ALIF_L[root[0]] || root[0];
  const variants = [root.normalize("NFC"), root.normalize("NFD")]
    .filter((v, i, a) => a.indexOf(v) === i);
  let rec = null;
  for (const n of variants) {
    try {
      const r = await fetch(`./${lex}/${encodeURIComponent(L)}/${encodeURIComponent(n)}.json`);
      if (r.ok) { rec = await r.json(); break; }
    } catch (e) { /* try next */ }
  }
  ENTRIES.set(key, rec);
  return rec;
}

/* ---------------- accordion ---------------- */
function buildLetters() {
  const host = document.getElementById("letters");
  host.innerHTML =
    '<div class="letter-grid" id="letterGrid">' +
    INDEX.map(g =>
      `<div class="letter-tile" role="button" tabindex="0" aria-selected="false" data-letter="${g.letter}">
         <span class="lt">${g.letter}</span><span class="cnt">${g.roots.length}</span>
       </div>`).join("") +
    '</div><div class="letter-panel" id="letterPanel"></div>';

  const grid = document.getElementById("letterGrid");
  const panel = document.getElementById("letterPanel");

  function openLetter(tile) {
    const L = tile.dataset.letter;
    const wasOpen = tile.getAttribute("aria-selected") === "true";
    grid.querySelectorAll(".letter-tile").forEach(t => t.setAttribute("aria-selected", "false"));
    if (wasOpen) { panel.classList.remove("open"); panel.innerHTML = ""; return; }
    tile.setAttribute("aria-selected", "true");
    const g = INDEX.find(x => x.letter === L);
    panel.innerHTML = g.roots.map(x =>
      `<a class="root-link" data-root="${x.r}" role="button" tabindex="0">${x.d}</a>`).join("");
    panel.classList.add("open");
    panel.querySelectorAll(".root-link").forEach(a => {
      const go = () => selectRoot(a.dataset.root);
      a.addEventListener("click", go);
      a.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); go(); } });
    });
    markCurrent();
  }

  grid.querySelectorAll(".letter-tile").forEach(tile => {
    tile.addEventListener("click", () => openLetter(tile));
    tile.addEventListener("keydown", ev => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openLetter(tile); }
    });
  });
}

function markCurrent() {
  document.querySelectorAll(".root-link").forEach(a =>
    a.classList.toggle("current", a.dataset.root === state.root));
}

/* ---------------- search ---------------- */
const rootInput = document.getElementById("rootSearch");
const chipsEl = document.getElementById("chips");

function runSearch() {
  const v = rootInput.value.trim();
  chipsEl.innerHTML = "";
  if (!v) return;
  const cands = candidates(v);
  if (!cands.length) {
    chipsEl.innerHTML = '<span class="chip none">No root found — try another form</span>';
    return;
  }
  if (cands.length === 1 && norm(v) === norm(cands[0])) { selectRoot(cands[0]); return; }
  chipsEl.innerHTML = `<span class="hint">${cands.length} possible root${cands.length > 1 ? "s" : ""} — choose one:</span>` +
    cands.map(r => `<button type="button" class="chip" data-root="${r}">${r}</button>`).join("");
  chipsEl.querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => selectRoot(b.dataset.root)));
}
rootInput.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); runSearch(); } });
rootInput.addEventListener("input", () => { if (!rootInput.value.trim()) chipsEl.innerHTML = ""; });

/* ---------------- selection + render ---------------- */
async function selectRoot(root) {
  state.root = root;
  chipsEl.innerHTML = "";
  rootInput.value = root;
  syncHash();
  markCurrent();
  await render();
}

const entryEl = document.getElementById("entry");
const stateBlock = (en, ar) => `<div class="state">${en}<span class="ar">${ar}</span></div>`;

async function render() {
  const { root, lex } = state;
  if (!root) return void (entryEl.innerHTML = "");
  if (!lex)  return void (entryEl.innerHTML = stateBlock("Choose a lexicon for this root.", "اختر معجمًا لهذا الجذر."));

  const L = lexById(lex);
  entryEl.innerHTML = stateBlock("Loading…", "جارٍ التحميل…");

  const rec = await loadEntry(root, lex);
  if (!rec) return void (entryEl.innerHTML =
    stateBlock(`${L.en} has no entry for this root.`, "لا توجد مادة لهذا الجذر في هذا المعجم."));

  const c = rec.citation;
  const pages = c.page_from === c.page_to ? `p. ${c.page_from}` : `pp. ${c.page_from}–${c.page_to}`;
  const translated = rec.entries.some(e => e.en);

  let html = `<div class="entry-card">
    <div class="entry-head">
      <div class="side-ar"><span class="root-ar">${rec.root_display}</span></div>
      <div class="side-en"><span class="root-en">${translitRoot(rec.root)}</span></div>
    </div>
    <div class="tool-row">
      <div class="left">
        <button type="button" class="pill-btn ar" id="tashkilToggle" aria-pressed="${state.tashkil}">تَشْكِيل</button>
        <button type="button" class="pill-btn ar" data-cite="ar">استشهاد</button>
      </div>
      <button type="button" class="pill-btn" data-cite="en">Cite</button>
    </div>`;
  if (!translated) html += `<div class="untranslated">Arabic text only — translation pending.</div>`;

  let prev = null;
  rec.entries.forEach(p => {
    if (p.pg && p.pg !== prev) { html += `<div class="page-pill-row"><span class="page-pill">${p.pg}</span></div>`; prev = p.pg; }
    const ar = state.tashkil ? (p.ar_vocalised || p.ar) : (p.ar || p.ar_vocalised);
    html += `<div class="para"><div class="ar" dir="rtl">${fmt(ar)}</div>` +
            (p.en ? `<div class="en" dir="ltr">${fmt(p.en)}${p.note ? `<div class="note">${p.note}</div>` : ""}</div>`
                  : `<div class="en"></div>`) + `</div>`;
  });
  html += `</div>`;
  entryEl.innerHTML = html;

  const arNum = n => String(n).replace(/[0-9]/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
  entryEl.querySelectorAll("[data-cite]").forEach(btn => {
    btn.addEventListener("click", () => {
      const t = btn.dataset.cite === "en"
        ? `${L.en}, vol. ${c.volume}, ${pages}, s.v. ${rec.root_display}.`
        : `${L.ar}، ج ${arNum(c.volume)}، ${c.page_from === c.page_to ? "ص " + arNum(c.page_from) : "ص " + arNum(c.page_from) + "–" + arNum(c.page_to)}، مادة ${rec.root_display}.`;
      navigator.clipboard && navigator.clipboard.writeText(t);
      const o = btn.textContent;
      btn.classList.add("copied");
      btn.textContent = btn.dataset.cite === "en" ? "Copied" : "نُسِخ";
      setTimeout(() => { btn.classList.remove("copied"); btn.textContent = o; }, 1300);
    });
  });
  const tb = entryEl.querySelector("#tashkilToggle");
  if (tb) tb.addEventListener("click", () => {
    state.tashkil = !state.tashkil;
    render();
  });
}

/* ---------------- lexicon dropdown ---------------- */
(function () {
  const dd = document.getElementById("lexDropdown");
  const btn = dd.querySelector(".dropdown-btn");
  const panel = dd.querySelector(".dropdown-panel");
  const label = dd.querySelector(".label");
  panel.innerHTML = LEXICA.map(l =>
    `<div class="dropdown-opt" role="option" data-id="${l.id}">
       <span class="opt-en">${l.en}</span><span class="opt-ar" dir="rtl">${l.ar}</span></div>`).join("");
  const close = () => { panel.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); };
  const open  = () => { panel.classList.add("open");  btn.setAttribute("aria-expanded", "true"); };
  btn.addEventListener("click", () => panel.classList.contains("open") ? close() : open());
  panel.querySelectorAll(".dropdown-opt").forEach(opt => {
    opt.addEventListener("click", () => {
      state.lex = opt.dataset.id;
      label.textContent = lexById(state.lex).en;
      label.classList.remove("placeholder");
      panel.querySelectorAll(".dropdown-opt").forEach(o => o.classList.toggle("active", o === opt));
      close(); syncHash(); render();
    });
  });
  document.addEventListener("click", ev => { if (!dd.contains(ev.target)) close(); });
})();

/* ---------------- browse collapse ---------------- */
(function () {
  const head = document.getElementById("browseHead");
  const box = document.getElementById("letters");
  const t = () => {
    const open = box.style.display !== "none";
    box.style.display = open ? "none" : "";
    head.setAttribute("aria-expanded", String(!open));
  };
  head.addEventListener("click", t);
  head.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); t(); } });
})();

/* ---------------- deep links ---------------- */
function syncHash() {
  const p = [];
  if (state.root) p.push("root=" + encodeURIComponent(state.root));
  if (state.lex)  p.push("lex=" + state.lex);
  history.replaceState(null, "", p.length ? "#" + p.join("&") : location.pathname);
}
async function boot() {
  await loadIndex();
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const r = h.get("root"), l = h.get("lex");
  if (l && lexById(l)) {
    state.lex = l;
    const dd = document.getElementById("lexDropdown");
    dd.querySelector(".label").textContent = lexById(l).en;
    dd.querySelector(".label").classList.remove("placeholder");
    dd.querySelectorAll(".dropdown-opt").forEach(o => o.classList.toggle("active", o.dataset.id === l));
  }
  if (r) { rootInput.value = decodeURIComponent(r); state.root = decodeURIComponent(r); markCurrent(); }
  await render();
}
boot();

/* Deep links, back/forward: re-render when the hash changes. */
let _hash = location.hash;
window.addEventListener("hashchange", () => {
  if (location.hash === _hash) return;
  _hash = location.hash;
  applyHash();
});
async function applyHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  const r = h.get("root"), l = h.get("lex");
  state.root = r ? decodeURIComponent(r) : null;
  rootInput.value = state.root || "";
  if (l && lexById(l)) {
    state.lex = l;
    const dd = document.getElementById("lexDropdown");
    dd.querySelector(".label").textContent = lexById(l).en;
    dd.querySelector(".label").classList.remove("placeholder");
    dd.querySelectorAll(".dropdown-opt").forEach(o => o.classList.toggle("active", o.dataset.id === l));
  }
  markCurrent();
  await render();
}
</script>
